<title>Asistente de visitas FACBSA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap">
<style>
/* Un solo hilo de chat, como WhatsApp, a ancho de telefono. El cobre del
   conductor bimetalico sobre el acero: entrantes en acero, salientes en cobre. */
:root{
  --cobre:#A8521C; --cobre-claro:#C8702F; --cobre-tenue:#F6EBE2; --cobre-burbuja:#F3DFCE;
  --fondo:#EDE9E4; --panel:#FFFFFF; --panel-2:#E3DED8; --borde:#DCD6CF; --borde-2:#C3BBB2;
  --tinta:#17130F; --tinta-2:#4A423B; --tenue:#847970;
  --ok:#2E6B38; --atencion:#8A6410; --critico:#9E2B20;
  --sombra:0 1px 1px rgba(23,19,15,.08);
  --r:14px;
  --display:"Archivo","Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --cobre:#D98A4F; --cobre-claro:#E8A062; --cobre-tenue:#2F2117; --cobre-burbuja:#3A2718;
    --fondo:#14110E; --panel:#1F1B17; --panel-2:#2A241D; --borde:#332C25; --borde-2:#463D33;
    --tinta:#F2EDE8; --tinta-2:#BCB2A8; --tenue:#8A8077;
    --ok:#7FB889; --atencion:#D9AE4E; --critico:#E08076;
    --sombra:0 1px 2px rgba(0,0,0,.45);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --cobre:#D98A4F; --cobre-claro:#E8A062; --cobre-tenue:#2F2117; --cobre-burbuja:#3A2718;
  --fondo:#14110E; --panel:#1F1B17; --panel-2:#2A241D; --borde:#332C25; --borde-2:#463D33;
  --tinta:#F2EDE8; --tinta-2:#BCB2A8; --tenue:#8A8077;
  --ok:#7FB889; --atencion:#D9AE4E; --critico:#E08076;
  --sombra:0 1px 2px rgba(0,0,0,.45);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--fondo);color:var(--tinta);font-family:var(--display);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
.app{display:flex;flex-direction:column;height:100%;max-width:620px;margin:0 auto;background:var(--fondo)}

/* barra de arriba, como la cabecera de un chat */
.barra{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:11px;
  padding:9px 14px;background:var(--panel);border-bottom:1px solid var(--borde)}
.ava{flex:0 0 auto;width:38px;height:38px;border-radius:50%;background:var(--cobre);color:#fff;
  display:grid;place-items:center;font-weight:700;font-size:15px;letter-spacing:.02em}
.quien-barra{min-width:0;flex:1}
.barra h1{margin:0;font-size:15.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.barra .sub{display:block;font-size:11.5px;color:var(--tenue);font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.barra .sub.vivo::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;
  background:var(--ok);margin-right:5px;vertical-align:1px}

/* el hilo */
.cuerpo{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.hilo{display:flex;flex-direction:column;gap:7px;padding:14px 12px 6px}
.msg{max-width:85%;padding:8px 11px;border-radius:var(--r);box-shadow:var(--sombra);
  white-space:pre-wrap;overflow-wrap:anywhere}
.msg.bot,.msg.ficha{align-self:flex-start;background:var(--panel);border-top-left-radius:4px}
.msg.yo{align-self:flex-end;background:var(--cobre-burbuja);border-top-right-radius:4px}
.msg.ficha{max-width:95%;font-size:14px;line-height:1.5}
.msg.ficha b{font-weight:700}
.msg.ficha .reng-tit{display:block;font-size:15.5px;margin-bottom:1px}
.msg.sistema{align-self:center;max-width:94%;background:var(--cobre-tenue);border:1px solid var(--borde);
  color:var(--tinta-2);font-size:12.5px;text-align:center;box-shadow:none;padding:7px 11px;border-radius:9px}
.msg .hora{display:block;text-align:right;font-size:10.5px;color:var(--tenue);margin-top:2px;letter-spacing:.02em}
.dia{align-self:center;background:var(--panel-2);color:var(--tenue);font-size:11px;font-weight:600;
  padding:3px 11px;border-radius:9px;letter-spacing:.04em;text-transform:uppercase}

/* botonera de respuestas rapidas */
.opciones{align-self:flex-start;display:flex;flex-wrap:wrap;gap:6px;max-width:95%;margin:1px 0 3px}
.opciones button{border:1px solid var(--cobre);background:var(--panel);color:var(--cobre);
  border-radius:16px;padding:7px 13px;font:inherit;font-size:13.5px;font-weight:600;cursor:pointer;min-height:36px}
.opciones button.tenue{border-color:var(--borde-2);color:var(--tinta-2);font-weight:500}

.pensando{align-self:flex-start;display:flex;align-items:center;gap:4px;background:var(--panel);
  border-radius:var(--r);border-top-left-radius:4px;padding:11px 13px;box-shadow:var(--sombra)}
.pensando i{width:6px;height:6px;border-radius:50%;background:var(--tenue);animation:lat 1.1s infinite}
.pensando i:nth-child(2){animation-delay:.18s}
.pensando i:nth-child(3){animation-delay:.36s}
.pensando .que{font-size:12.5px;color:var(--tenue);margin-left:4px}
.pensando .parar{margin-left:6px;border:1px solid var(--borde-2);background:transparent;color:var(--tinta-2);
  border-radius:12px;padding:2px 9px;font:inherit;font-size:11.5px;cursor:pointer;min-height:24px}
@keyframes lat{0%,60%,100%{opacity:.3}30%{opacity:1}}
@media (prefers-reduced-motion:reduce){.pensando i{animation:none;opacity:.6}}

/* compositor */
.comp{position:sticky;bottom:0;background:var(--panel);border-top:1px solid var(--borde);
  padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));display:flex;gap:7px;align-items:flex-end}
.comp textarea{flex:1;min-width:0;resize:none;border:1px solid var(--borde-2);border-radius:20px;background:var(--fondo);
  color:var(--tinta);font:inherit;font-size:16px;padding:10px 14px;max-height:120px;min-height:42px;line-height:1.35}
.comp textarea:focus-visible{outline:2px solid var(--cobre);outline-offset:1px;border-color:var(--cobre)}
.comp button{flex:0 0 auto;width:42px;height:42px;border-radius:50%;border:1px solid var(--borde-2);
  background:var(--fondo);color:var(--tinta-2);font-size:17px;cursor:pointer;display:grid;place-items:center}
.comp button.enviar{border:none;background:var(--cobre);color:#fff;font-size:18px}
.comp button:disabled{opacity:.4;cursor:default}
:focus-visible{outline:2px solid var(--cobre);outline-offset:2px}
</style>

<div class="app">
  <header class="barra">
    <div class="ava" id="avatar" aria-hidden="true">FA</div>
    <div class="quien-barra">
      <h1 id="titulo">Asistente de visitas</h1>
      <span class="sub vivo" id="subtitulo">FACBSA · fuerza de ventas</span>
    </div>
  </header>

  <div class="cuerpo" id="cuerpo">
    <div class="hilo" id="hilo"></div>
  </div>

  <div class="comp">
    <textarea id="entrada" rows="1" placeholder="Escribí o dictá…" autocomplete="off"></textarea>
    <button id="dictar" type="button" aria-label="Cómo dictar">🎤</button>
    <button id="enviar" type="button" class="enviar" aria-label="Enviar">↑</button>
  </div>
</div>

<script id="datos-clientes" type="application/json">__DATOS__</script>
<script id="datos-ventas" type="application/json">__VENTAS__</script>
